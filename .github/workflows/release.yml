name: Release

# Sürüm etiketi atılınca (örn. v0.1.0) Windows kurulum dosyasını üretir ve taslak
# GitHub Release'e ekler. Windows derlemesi macOS'ta yapılamaz (çapraz derleme yok),
# bu yüzden windows-latest koşucusu kullanılır.
#
# Elle çalıştırmak için: Actions → Release → Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Taslak sürüme dosya eklemek yazma izni ister; varsayılan GITHUB_TOKEN salt okunur
# olduğunda "Taslak sürüme ekle" adımı 403 ile düşer.
permissions:
  contents: write

jobs:
  windows:
    name: Windows kurulum dosyası
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust derlemesi uzun sürer; önbellek olmadan her koşu ~10 dk.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # NSIS (.exe) ve MSI birlikte üretilir. İmzalama yapılmaz — imzalama
      # sertifikası eklendiğinde tauri.conf.json > bundle.windows alanları doldurulur
      # (bkz docs/yayinlama.md §3).
      #
      # VITE_* değerleri derleme anında pakete gömülür; depo sırlarından okunur.
      # Sır tanımlı değilse boş gelir ve ilgili entegrasyon (GitHub/Google) kapalı kalır —
      # derleme yine de tamamlanır.
      - name: Derle
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.VITE_GOOGLE_ANDROID_CLIENT_ID }}
        run: npm run tauri build -- --bundles nsis,msi

      # Microsoft Store paketi (imzasız MSIX; Store imzalar). Ayrıntı: scripts/build-msix.ps1
      - name: MSIX paketi
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/build-msix.ps1 -Version $v

      - name: MSIX yükle
        uses: actions/upload-artifact@v4
        with:
          name: loomen-windows-msix
          path: Loomen_*_x64.msix
          if-no-files-found: error

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: loomen-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Etiketle tetiklendiyse taslak sürüme de ekle (workflow_dispatch'te atlanır).
      - name: Taslak sürüme ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
